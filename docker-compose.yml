services:
  prd-creator:
    build:
      context: .
      dockerfile: Dockerfile
    image: prd-creator:latest
    container_name: prd-creator
    restart: unless-stopped
    ports:
      # Port unik 3773 di host (PRD = 773 pada keypad telepon) -> port 3000 di dalam container
      - "3773:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Opsional: default server-side API Key (jika tidak diinput via browser settings)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

